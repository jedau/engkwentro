# Rust is the channel in contracts/rust-toolchain.toml. The action ref below
# is that same channel. scripts/check.sh rejects the job when they differ, or
# when the compiler on PATH is a different version.
# near-sdk stays at 5.30.0 in contracts/Cargo.toml.
# Flutter is the flutter-version below. docs/TOOLCHAIN.md records it.
name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build tools
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Run scripts/check.sh
        run: bash scripts/check.sh
