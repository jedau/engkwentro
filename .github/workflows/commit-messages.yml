name: Commit messages

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch default branch
        run: git fetch --no-tags origin "${{ github.event.repository.default_branch }}"

      - name: Fetch pull request head
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head"

      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-commit-message.sh -m "$PR_TITLE"

      - name: Check commit subjects
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/check-commit-range.sh
