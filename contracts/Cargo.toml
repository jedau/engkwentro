[workspace]
resolver = "2"
members = ["engkwentro", "engkwentro-registry", "engkwentro-vault"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

[workspace.dependencies]
near-sdk = { version = "5.30.0", features = ["legacy"] }
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
