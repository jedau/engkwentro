<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect x="2" y="2" width="44" height="44" rx="4" fill="#182232" stroke="#DDA835" stroke-width="2"/>
  <rect x="5" y="5" width="38" height="38" rx="2" fill="none" stroke="#A37A20" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="24" y="11" fill="#F3E3B6" font-family="monospace" font-size="6" font-weight="bold" text-anchor="middle">SPY</text>

  <!-- Fedora brim (wide, slight front dip) -->
  <path
    d="M8,23
       C10,20.5 14,19.5 18,19.8
       C20.5,20 22,21.2 24,21.2
       C26,21.2 27.5,20 30,19.8
       C34,19.5 38,20.5 40,23
       C38.5,25.8 33,27 24,27
       C15,27 9.5,25.8 8,23 Z"
    fill="#DDA835"/>

  <!-- Fedora crown -->
  <path
    d="M16,21.5
       L16.5,16.5
       C17,14.2 19.2,13 21.2,13.2
       C22.2,13.3 22.8,14.2 24,14.2
       C25.2,14.2 25.8,13.3 26.8,13.2
       C28.8,13 31,14.2 31.5,16.5
       L32,21.5
       C28.5,22.2 19.5,22.2 16,21.5 Z"
    fill="#DDA835"/>

  <!-- Crown pinch crease -->
  <path d="M21.5,14.5 Q24,16.2 26.5,14.5" fill="none" stroke="#182232" stroke-width="1" stroke-linecap="round" opacity="0.85"/>

  <!-- Ribbon band -->
  <path
    d="M16.2,20.2
       C19.5,21.2 28.5,21.2 31.8,20.2
       L31.5,22.4
       C28.2,23.2 19.8,23.2 16.5,22.4 Z"
    fill="#182232"/>
  <!-- Side bow -->
  <ellipse cx="31.2" cy="21.4" rx="1.8" ry="1.3" fill="#182232"/>
  <ellipse cx="33.4" cy="21.6" rx="1.5" ry="1.1" fill="#182232"/>
  <circle cx="32.3" cy="21.5" r="0.7" fill="#DDA835"/>

  <!-- Forward-facing binoculars -->
  <circle cx="17.5" cy="34" r="6.5" fill="#DDA835"/>
  <circle cx="30.5" cy="34" r="6.5" fill="#DDA835"/>
  <rect x="21" y="32" width="6" height="4" rx="1" fill="#DDA835"/>
  <circle cx="17.5" cy="34" r="4.2" fill="none" stroke="#182232" stroke-width="1.4"/>
  <circle cx="30.5" cy="34" r="4.2" fill="none" stroke="#182232" stroke-width="1.4"/>
  <circle cx="17.5" cy="34" r="3" fill="#182232"/>
  <circle cx="30.5" cy="34" r="3" fill="#182232"/>
  <circle cx="16" cy="32.5" r="1" fill="#F3E3B6" opacity="0.35"/>
  <circle cx="29" cy="32.5" r="1" fill="#F3E3B6" opacity="0.35"/>
